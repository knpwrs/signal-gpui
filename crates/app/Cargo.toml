[package]
name = "signal-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A native Signal Desktop client built on GPUI"

[[bin]]
name = "signal-gpui"
path = "src/main.rs"

[dependencies]
signal-backend.workspace = true
signal-emoji.workspace = true
signal-store.workspace = true
gpui-kit.workspace = true

anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
directories = "6"
hex = "0.4"
linkify = "0.10"
url = "2"
# Frames for looping video (GIFs) handed to gpui.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
qrcode = { version = "0.14", default-features = false }
# Stickers for the pack creator: decoded, fitted to 512px, then lossy WebP
# (libwebp), as Desktop's creator encodes them.
webp = { version = "0.3", default-features = false }
rand = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# Notifications (UserNotifications), with an inline reply field.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
# The ringtone (NSSound).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSound"] }
# Playing audio attachments and voice messages, and their waveforms.
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioPlayer", "AVAudioFile", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes"] }


[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
