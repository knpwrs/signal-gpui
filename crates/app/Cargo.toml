[package]
name = "signal-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A native Signal Desktop client built on GPUI"

[[bin]]
name = "signal-gpui"
path = "src/main.rs"

[dependencies]
signal-backend.workspace = true
signal-emoji.workspace = true
signal-store.workspace = true
gpui-kit.workspace = true

anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
directories = "6"
hex = "0.4"
linkify = "0.10"
url = "2"
# Frames for looping video (GIFs) handed to gpui.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
qrcode = { version = "0.14", default-features = false }
resvg = { version = "0.45", default-features = false }
# Stickers for the pack creator: decoded, fitted to 512px, then lossy WebP
# (libwebp), as Desktop's creator encodes them.
webp = { version = "0.3", default-features = false }
rand = "0.9"
# Poll limits count characters as Desktop does: graphemes.
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# Notifications (UserNotifications), with an inline reply field.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
# The ringtone (NSSound), and hiding the main window on close (NSWindow).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSound", "NSResponder", "NSView", "NSWindow"] }
# The main window's NSView, to hide its NSWindow.
raw-window-handle = "0.6"
# Playing audio attachments and voice messages, and their waveforms.
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioPlayer", "AVAudioRecorder", "AVAudioSettings", "AVAudioFile", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes"] }
# Playing video attachments: AVPlayer, with its frames read out as BGRA.
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }


[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
