[package]
name = "signal-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
signal-calls = { path = "../calls" }
signal-store.workspace = true
presage.workspace = true
presage-store-sqlite.workspace = true
anyhow.workspace = true
futures.workspace = true
# `net`: DNS lookups for link previews, which only connect to public addresses.
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
# Release notes: Desktop versions, and the languages to fetch them in.
semver = "1"
sys-locale = "0.3"
url = "2"
rand = "0.9"
# Storage Service writes: item crypto and wire-level record edits (versions
# match libsignal-service's).
aes-gcm = "0.11"
base64 = "0.22"
# Group requests: the group's public params are bincode-encoded, then hex.
bincode = "1.3"
hex = "0.4"
# Message history at link time ("link and sync"): the backup format's
# frames and keys, from the same libsignal as presage.
# (`test-util` only makes its generated protobuf types public.)
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", features = ["test-util"] }
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }
# Attachments in the backup (media) tier: backup auth credentials and the
# key that signs their presentations. Newer than presage's libsignal, as
# Signal's servers now use version 1 ("standard") generic server params,
# which v0.99's zkgroup can't read; this is the release Desktop 8.34 uses.
zkgroup = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.0" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.0" }
backup-account-keys = { package = "libsignal-account-keys", git = "https://github.com/signalapp/libsignal", tag = "v0.105.0" }
# Key transparency (automatic key verification in safety numbers): libsignal's
# client and verifier, driven over presage's unauthenticated websocket.
libsignal-net-chat = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }
libsignal-keytrans = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }
libsignal-net = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }
async-trait = "0.1"
protobuf = "3"
hkdf = "0.13"
hmac = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
prost = "0.14"
sha2 = "0.11"
unicode-segmentation = "1.12"
# Draws the demo photo.
png = "0.18"
# Link previews: finding links, parsing pages, fetching over TLS checked
# against the system's trust store.
linkify = "0.10"
chrono.workspace = true
idna = "1"
scraper = "0.27"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# Debug logs: redaction and gzip for upload.
regex = "1"
flate2 = "1"
# Lossless optimization of images we send.
oxipng = { version = "10", default-features = false, features = ["parallel"] }
# `unwinding` turns libjpeg errors into catchable panics instead of aborts.
mozjpeg-sys = { version = "2", default-features = false, features = ["unwinding"] }
imagesize = "0.15"
# TIFF/BMP (what macOS often puts on the clipboard) become PNG before sending.
# Quote thumbnails decode what was quoted (JPEG, WebP and GIF too).
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp", "ico", "jpeg", "webp", "gif"] }

[dev-dependencies]
# libsignal's fixed-seed test rng, to check presentations against its vectors.
rand_chacha = "0.9"
# Paused time, for retries and back-off in tests.
tokio = { workspace = true, features = ["test-util"] }
jpeg-encoder = "0.6"
jpeg-decoder = "0.3"
tempfile = "3"
